[package]
name = "ontic"
version = "0.1.0"
edition = "2021"
description = "Stochastic specification compiler: wishes in, verified MLIR out."
license = "Apache-2.0 WITH LLVM-exception"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
z3 = { version = "0.12", optional = true }

[features]
proven = ["dep:z3"]

[profile.release]
lto = true
codegen-units = 1
